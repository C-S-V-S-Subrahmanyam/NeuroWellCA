services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neurowellca-postgres
    environment:
      POSTGRES_USER: neurowellca_user
      POSTGRES_PASSWORD: neurowellca_password_2026
      POSTGRES_DB: neurowellca_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - neurowellca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurowellca_user -d neurowellca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: neurowellca-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - neurowellca-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For systems without GPU, remove the deploy section above

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neurowellca-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - neurowellca-network
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Backend API (FastAPI)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurowellca-backend
    environment:
      - DATABASE_URL=postgresql://neurowellca_user:neurowellca_password_2026@postgres:5432/neurowellca_db
      - OLLAMA_API_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=your-secret-key-change-in-production-min-32-chars
      - JWT_SECRET_KEY=your-jwt-secret-key-change-in-production-min-32-chars
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - backend_models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - neurowellca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: python -m uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000

  # Frontend runs locally (npm run dev), not in Docker
  # This avoids port conflicts and allows for faster development

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  qdrant_data:
    driver: local
  backend_models:
    driver: local

networks:
  neurowellca-network:
    driver: bridge
